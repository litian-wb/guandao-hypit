name: Hypit render
on:
  workflow_dispatch:
    inputs:
      mode:
        description: smoke or production
        default: smoke
        required: true
        type: choice
        options: [smoke, production]
permissions:
  contents: read
concurrency:
  group: guandao-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/checkout@v4
        with:
          repository: hypit-ai/hypit
          ref: dc2b7a8f31b1ef1443a79ca448548d69e3ceb6a0
          path: engine
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install only CPU rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          google-chrome --version
          cd engine
          pnpm install --frozen-lockfile
          pnpm build:public-types
          pnpm --filter @example/chat-scene build
      - name: Render without model services
        env:
          RENDER_MODE: ${{ inputs.mode }}
        run: python3 project/cloud_render.py
      - name: Upload final video and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypit-${{ inputs.mode }}
          path: project/output/
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
